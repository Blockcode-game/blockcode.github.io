<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BlockCode Editor</title>
<link rel="icon" type="image/png" href="favicon.png">
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    /* Tabs bar */
    #tabBar {
      display: flex;
      background: #ddd;
      border-bottom: 2px solid #bbb;
    }

    .tabBtn {
      padding: 12px 20px;
      cursor: pointer;
      font-weight: bold;
      background: #ccc;
      border-right: 2px solid #bbb;
      user-select: none;
    }

    .tabBtn.active {
      background: white;
      border-bottom: 3px solid #4C97FF;
    }

    /* Panels */
    .panel {
      flex: 1;
      display: none;
      overflow: hidden;
      background: #fafafa;
    }

    .panel.active {
      display: block;
    }

    /* Scripts panel */
    #scriptsArea {
      width: 100%;
      height: 100%;
    }

    #scriptsWorkspace {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Costumes panel */
    #costumesPanel {
      padding: 12px;
      overflow-y: auto;
    }

    .costume-list div {
      background: #e0e0e0;
      padding: 8px;
      margin-top: 6px;
      border-radius: 6px;
    }

    /* Sounds panel */
    #soundsPanel {
      padding: 12px;
      overflow-y: auto;
    }

    .sound-list div {
      background: #dfe6ff;
      padding: 8px;
      margin-top: 6px;
      border-radius: 6px;
      border-left: 4px solid #4C97FF;
    }
  </style>
</head>

<body>

  <!-- TAB BAR -->
  <div id="tabBar">
    <div class="tabBtn active" data-panel="scriptsPanel">Scripts</div>
    <div class="tabBtn" data-panel="costumesPanel">Costumes</div>
    <div class="tabBtn" data-panel="soundsPanel">Sounds</div>
  </div>

  <!-- PANELS -->
  <div id="scriptsPanel" class="panel active">
    <div id="scriptsArea"></div>
    <div id="scriptsWorkspace"></div>
  </div>

  <div id="costumesPanel" class="panel">
    <h3>Costumes</h3>
    <input type="file" id="costumeInput" accept=".png,.jpg,.jpeg,.gif,.svg,.webp">
    <div id="costumeList" class="costume-list"></div>
  </div>

  <div id="soundsPanel" class="panel">
    <h3>Sounds</h3>
    <input type="file" id="soundInput" accept=".wav,.mp3,.mp4">
    <div id="soundList" class="sound-list"></div>
  </div>

  <script>
    /* ------------------------------
       TAB SWITCHING (hide if not clicked)
    ------------------------------ */
    const tabButtons = document.querySelectorAll('.tabBtn');
    const panels = document.querySelectorAll('.panel');

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(btn.dataset.panel).classList.add('active');

        if (btn.dataset.panel === "scriptsPanel") {
          resizeScriptsWorkspace();
        }
      });
    });

    /* ------------------------------
       TOOLBOX (80+ blocks)
    ------------------------------ */
    const toolboxXml = `
      <xml xmlns="https://developers.google.com/blockly/xml">
        <category name="Motion" colour="#4C97FF">
          <block type="controls_if"></block>
          <block type="math_number"></block>
          <block type="motion_movesteps"></block>
          <block type="motion_turnright"></block>
          <block type="motion_turnleft"></block>
          <block type="motion_goto"></block>
          <block type="motion_gotoxy"></block>
          <block type="motion_glideto"></block>
          <block type="motion_glidesecstoxy"></block>
          <block type="motion_pointindirection"></block>
          <block type="motion_pointtowards"></block>
          <block type="motion_changexby"></block>
          <block type="motion_setx"></block>
          <block type="motion_changeyby"></block>
          <block type="motion_sety"></block>
          <block type="motion_ifonedgebounce"></block>
          <block type="motion_setrotationstyle"></block>
        </category>

        <category name="Looks" colour="#9966FF">
          <block type="looks_say"></block>
          <block type="looks_sayforsecs"></block>
          <block type="looks_think"></block>
          <block type="looks_thinkforsecs"></block>
          <block type="looks_switchcostumeto"></block>
          <block type="looks_nextcostume"></block>
          <block type="looks_switchbackdropto"></block>
          <block type="looks_nextbackdrop"></block>
          <block type="looks_changeeffectby"></block>
          <block type="looks_seteffectto"></block>
          <block type="looks_cleargraphiceffects"></block>
          <block type="looks_show"></block>
          <block type="looks_hide"></block>
          <block type="looks_gotofrontback"></block>
          <block type="looks_goforwardbackwardlayers"></block>
        </category>

        <category name="Sound" colour="#FFAB19">
          <block type="sound_play"></block>
          <block type="sound_playuntildone"></block>
          <block type="sound_stopallsounds"></block>
          <block type="sound_changeeffectby"></block>
          <block type="sound_seteffectto"></block>
          <block type="sound_cleareffects"></block>
          <block type="sound_changevolumeby"></block>
          <block type="sound_setvolumeto"></block>
        </category>

        <category name="Events" colour="#FFD500">
          <block type="event_whenflagclicked"></block>
          <block type="event_whenkeypressed"></block>
          <block type="event_whenthisspriteclicked"></block>
          <block type="event_whenbackdropswitchesto"></block>
          <block type="event_whengreaterthan"></block>
          <block type="event_whenbroadcastreceived"></block>
          <block type="event_broadcast"></block>
          <block type="event_broadcastandwait"></block>
        </category>

        <category name="Control" colour="#FFAB19">
          <block type="control_wait"></block>
          <block type="control_repeat"></block>
          <block type="control_forever"></block>
          <block type="control_if"></block>
          <block type="control_if_else"></block>
          <block type="control_wait_until"></block>
          <block type="control_repeat_until"></block>
          <block type="control_stop"></block>
          <block type="control_create_clone_of"></block>
          <block type="control_delete_this_clone"></block>
        </category>

        <category name="Sensing" colour="#4CBFE6">
          <block type="sensing_touchingobject"></block>
          <block type="sensing_touchingcolor"></block>
          <block type="sensing_coloristouchingcolor"></block>
          <block type="sensing_distanceto"></block>
          <block type="sensing_askandwait"></block>
          <block type="sensing_answer"></block>
          <block type="sensing_keypressed"></block>
          <block type="sensing_mousedown"></block>
          <block type="sensing_mousex"></block>
          <block type="sensing_mousey"></block>
          <block type="sensing_setdragmode"></block>
          <block type="sensing_loudness"></block>
          <block type="sensing_timer"></block>
          <block type="sensing_resettimer"></block>
        </category>

        <category name="Operators" colour="#40BF4A">
          <block type="operator_add"></block>
          <block type="operator_subtract"></block>
          <block type="operator_multiply"></block>
          <block type="operator_divide"></block>
          <block type="operator_random"></block>
          <block type="operator_gt"></block>
          <block type="operator_lt"></block>
          <block type="operator_equals"></block>
          <block type="operator_and"></block>
          <block type="operator_or"></block>
          <block type="operator_not"></block>
          <block type="operator_join"></block>
          <block type="operator_letter_of"></block>
          <block type="operator_length"></block>
          <block type="operator_contains"></block>
          <block type="operator_mod"></block>
          <block type="operator_round"></block>
          <block type="operator_mathop"></block>
        </category>

        <category name="Variables" colour="#FF8C1A" custom="VARIABLE"></category>
        <category name="My Blocks" colour="#FF6680" custom="PROCEDURE"></category>
      </xml>
    `;

    /* ------------------------------
       SCRIPTS WORKSPACE
    ------------------------------ */
    const scriptsWorkspace = Blockly.inject('scriptsWorkspace', {
      toolbox: toolboxXml,
      trashcan: true,
      scrollbars: true,
      zoom: {
        controls: true,
        wheel: true,
        startScale: 0.9
      }
    });

    function resizeScriptsWorkspace() {
      const area = document.getElementById('scriptsArea');
      const div = document.getElementById('scriptsWorkspace');
      const rect = area.getBoundingClientRect();

      div.style.left = rect.left + 'px';
      div.style.top = rect.top + 'px';
      div.style.width = rect.width + 'px';
      div.style.height = rect.height + 'px';

      Blockly.svgResize(scriptsWorkspace);
    }

    window.addEventListener('resize', resizeScriptsWorkspace);
    resizeScriptsWorkspace();

    /* ------------------------------
       COSTUMES TAB
    ------------------------------ */
    const costumeInput = document.getElementById('costumeInput');
    const costumeList = document.getElementById('costumeList');

    costumeInput.addEventListener('change', () => {
      costumeList.innerHTML = '';

      [...costumeInput.files].forEach(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        const allowed = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'];

        if (!allowed.includes(ext)) {
          alert(`Rejected: ${file.name} — only image files allowed`);
          return;
        }

        const div = document.createElement('div');
        div.textContent = file.name;
        costumeList.appendChild(div);
      });
    });

    /* ------------------------------
       SOUNDS TAB
    ------------------------------ */
    const soundInput = document.getElementById('soundInput');
    const soundList = document.getElementById('soundList');

    soundInput.addEventListener('change', () => {
      soundList.innerHTML = '';

      [...soundInput.files].forEach(file => {
        const ext = file.name.split('.').pop().toLowerCase();
        const allowed = ['wav', 'mp3', 'mp4'];

        if (!allowed.includes(ext)) {
          alert(`Rejected: ${file.name} — only .wav, .mp3, .mp4 allowed`);
          return;
        }

        const div = document.createElement('div');
        div.textContent = file.name;
        soundList.appendChild(div);
      });
    });
  </script>

</body>
</html>
