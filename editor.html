<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BlockCode Editor</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }

    #tabBar {
      display: flex;
      background: #ddd;
      border-bottom: 2px solid #bbb;
    }

    .tabBtn {
      padding: 12px 20px;
      cursor: pointer;
      font-weight: bold;
      background: #ccc;
      border-right: 2px solid #bbb;
      user-select: none;
    }

    .tabBtn.active {
      background: white;
      border-bottom: 3px solid #4C97FF;
    }

    .panel {
      flex: 1;
      display: none;
      overflow: hidden;
      background: #fafafa;
    }

    .panel.active {
      display: block;
    }

    #scriptsArea {
      width: 100%;
      height: 100%;
    }

    #scriptsWorkspace {
      position: absolute;
      top: 0;
      left: 0;
    }

    #costumesPanel {
      padding: 12px;
      overflow-y: auto;
    }

    .costume-list div {
      background: #e0e0e0;
      padding: 8px;
      margin-top: 6px;
      border-radius: 6px;
    }

    #costumeEditor {
      display: none;
      margin-top: 12px;
      background: white;
      border: 1px solid #bbb;
      border-radius: 8px;
      padding: 10px;
    }

    #costumeToolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .drawTool {
      padding: 8px 11px;
      border: 1px solid #aaa;
      border-radius: 5px;
      background: #eee;
      cursor: pointer;
      font-weight: bold;
    }

    .drawTool:hover {
      background: #ddd;
    }

    .drawTool.active {
      background: #4C97FF;
      color: white;
      border-color: #3578cc;
    }

    #costumeCanvasWrap {
      width: 100%;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background:
        linear-gradient(45deg, #eee 25%, transparent 25%),
        linear-gradient(-45deg, #eee 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eee 75%),
        linear-gradient(-45deg, transparent 75%, #eee 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      border: 1px solid #aaa;
    }

    #costumeCanvas {
      max-width: 100%;
      height: auto;
      cursor: crosshair;
      background: transparent;
    }

    #textInput {
      display: none;
      position: fixed;
      z-index: 20;
      padding: 6px;
      border: 2px solid #4C97FF;
      border-radius: 4px;
    }

    #soundsPanel {
      padding: 12px;
      overflow-y: auto;
    }

    .sound-list div {
      background: #dfe6ff;
      padding: 8px;
      margin-top: 6px;
      border-radius: 6px;
      border-left: 4px solid #4C97FF;
    }
  </style>
</head>

<body>

  <div id="tabBar">
    <div class="tabBtn active" data-panel="scriptsPanel">Scripts</div>
    <div class="tabBtn" data-panel="costumesPanel">Costumes</div>
    <div class="tabBtn" data-panel="soundsPanel">Sounds</div>
  </div>

  <div id="scriptsPanel" class="panel active">
    <div id="scriptsArea"></div>
    <div id="scriptsWorkspace"></div>
  </div>

  <div id="costumesPanel" class="panel">
    <h3>Costumes</h3>
    <input type="file" id="costumeInput" accept=".png,.jpg,.jpeg,.gif,.svg,.webp">

    <div id="costumeEditor">
      <div id="costumeToolbar">
        <button class="drawTool active" data-tool="paint">🖌️ Paint</button>
        <button class="drawTool" data-tool="erase">🧽 Erase</button>
        <button class="drawTool" data-tool="circle">⭕ Circle</button>
        <button class="drawTool" data-tool="square">⬜ Square</button>
        <button class="drawTool" data-tool="triangle">🔺 Triangle</button>
        <button class="drawTool" data-tool="delete">🗑️ Delete</button>
        <button class="drawTool" data-tool="select">🔲 Select</button>
        <button class="drawTool" data-tool="point">📍 Point Selector</button>
        <button class="drawTool" data-tool="text">T Text</button>
      </div>

      <div id="costumeCanvasWrap">
        <canvas id="costumeCanvas"></canvas>
      </div>
    </div>

    <div id="costumeList" class="costume-list"></div>
  </div>

  <div id="soundsPanel" class="panel">
    <h3>Sounds</h3>

        tabButtons.forEach(b => b.classList.remove('active'));

    /* ------------------------------
       REGISTER EVERY BLOCK
    ------------------------------ */

    Object.entries(blockDefinitions).forEach(([type, definition]) => {

      Blockly.Blocks[type] = {
        init: function() {

          const args = [];

          if (definition.inputs) {
            definition.inputs.forEach((inputType, index) => {

              let input = this.appendValueInput('INPUT' + index);

              if (inputType === 'number') {
                input.setCheck('Number');
              }

              if (inputType === 'boolean') {
                input.setCheck('Boolean');
              }

              if (inputType === 'text') {
                input.setCheck(null);
              }

              input.appendField(
                definition.inputs.length === 1 ? '' : ''
              );
            });
          }

          /*
           * Blockly normally needs fields inside inputs.
           * Rebuild the visible message using dummy fields.
           */
          this.inputList = [];

          const parts = definition.label.split(/%[0-9]+/);
          const matches = definition.label.match(/%[0-9]+/g) || [];

          for (let i = 0; i < parts.length; i++) {

            if (parts[i]) {
              this.appendDummyInput()
                .appendField(parts[i]);
            }

            if (matches[i]) {
              const index = Number(matches[i].substring(1)) - 1;
              const inputType = definition.inputs[index];

              const input = this.appendValueInput('INPUT' + index);

              if (inputType === 'number') {
                input.setCheck('Number');
              }

              if (inputType === 'boolean') {
                input.setCheck('Boolean');
              }
            }
          }

          if (definition.output) {
            this.setOutput(true);
          } else {
            this.setPreviousStatement(true);
            this.setNextStatement(true);
          }

          if (definition.statement) {
            this.appendStatementInput('DO')
              .appendField('do');
          }

          if (definition.hat) {
            this.setNextStatement(true);
          }

          this.setColour(definition.colour);
          this.setTooltip(definition.label);
          this.setHelpUrl('');
        }
      };
    });
